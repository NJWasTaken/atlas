<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080d1d" />
    <title>Atlas</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #080d1d; color: #eee8dc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 42%, #172443 0%, #080d1d 62%); }
      main { text-align: center; padding: 2rem; }
      .mark { color: #d9b96e; font-size: 2.2rem; letter-spacing: .32em; margin-left: .32em; }
      h1 { font-weight: 500; letter-spacing: .12em; margin: 1rem 0 .5rem; }
      p { color: #9aa7ba; font-size: .9rem; }
      .hint { max-width: 34rem; margin: .75rem auto 0; line-height: 1.6; font-size: .78rem; }
      .orbit { width: 30px; height: 30px; border: 1px solid #d9b96e55; border-top-color: #d9b96e; border-radius: 50%; margin: 1.5rem auto 0; animation: spin 1.2s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .orbit { animation: none; } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">✦</div>
      <h1>ATLAS</h1>
      <p>Preparing your universe…</p>
      <p class="hint">Atlas is starting its local services. If this screen remains, close Atlas and check the API and frontend logs in your Atlas application-data folder.</p>
      <div class="orbit" aria-hidden="true"></div>
    </main>
  </body>
</html>
