<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080d1d" />
    <title>Atlas</title>
    <style>
      :root { color-scheme: dark; background: #080d1d; color: #eee8dc; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { text-align: center; padding: 2rem; }
      .mark { color: #d6b36a; font-size: 2rem; letter-spacing: .35em; margin-bottom: 1rem; }
      p { color: #9aa7ba; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">ATLAS</div>
      <p>Desktop shell migration prototype</p>
    </main>
  </body>
</html>
