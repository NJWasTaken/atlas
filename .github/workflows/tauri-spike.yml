name: Tauri desktop spike

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop-tauri/**"
      - ".github/workflows/tauri-spike.yml"

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: desktop-tauri
        run: cargo fmt --all -- --check
      - name: Check Tauri shell
        working-directory: desktop-tauri
        run: cargo check
