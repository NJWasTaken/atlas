name: Tauri desktop spike

on:
  pull_request:
    branches: [main]
    paths:
      - "desktop-tauri/**"
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/tauri-spike.yml"

permissions:
  contents: read

jobs:
  cargo-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: desktop-tauri
        run: cargo fmt --all -- --check
      - name: Prepare existing Atlas services for Tauri
        run: |
          npm ci --prefix frontend
          NEXT_PUBLIC_API_URL=http://127.0.0.1:43121/api/v1 npm --prefix frontend run build
          mkdir -p frontend/.next/standalone/.next
          cp -R frontend/.next/static frontend/.next/standalone/.next/static
          if [ -d frontend/public ]; then cp -R frontend/public frontend/.next/standalone/public; fi
          python -m pip install -r backend/requirements-desktop.txt
          python -m pip install pyinstaller
          pyinstaller --clean --onefile --name atlas-api --paths backend \
            --add-data "backend/migrations:migrations" \
            --add-data "backend/alembic.ini:." \
            --collect-all alembic --collect-all sqlalchemy --collect-all passlib --collect-all bcrypt \
            --hidden-import passlib.handlers.bcrypt backend/desktop_entry.py
          mkdir -p desktop-tauri/resources/runtime/frontend
          cp dist/atlas-api desktop-tauri/resources/runtime/atlas-api
          cp -R frontend/.next/standalone/. desktop-tauri/resources/runtime/frontend/
          curl -fsSLO https://nodejs.org/dist/v22.16.0/node-v22.16.0-linux-x64.tar.xz
          tar -xJf node-v22.16.0-linux-x64.tar.xz
          cp node-v22.16.0-linux-x64/bin/node desktop-tauri/resources/runtime/node
          chmod +x desktop-tauri/resources/runtime/node desktop-tauri/resources/runtime/atlas-api
      - name: Compile runnable Tauri desktop binary
        working-directory: desktop-tauri
        run: cargo build --release
      - name: Test Tauri runtime helpers
        working-directory: desktop-tauri
        run: cargo test
      - name: Stage runnable Linux prototype
        run: |
          mkdir -p desktop-tauri/target/release/runtime
          cp -R desktop-tauri/resources/runtime/. desktop-tauri/target/release/runtime/
      - name: Upload Tauri Linux prototype
        uses: actions/upload-artifact@v4
        with:
          name: atlas-tauri-linux-x64-prototype
          path: |
            desktop-tauri/target/release/atlas-tauri
            desktop-tauri/target/release/runtime/
          if-no-files-found: error
          retention-days: 7
