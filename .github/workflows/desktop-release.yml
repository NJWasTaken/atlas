name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without the v prefix, e.g. 0.3.0)"
        required: true
        type: string
      source_ref:
        description: "Branch or commit to package (must be contained in main)"
        required: true
        default: "main"
        type: string
      release_notes:
        description: "Manually written release notes"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: atlas-desktop-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate-manual-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manually supplied release metadata
        id: validate
        working-directory: desktop
        env:
          ATLAS_RELEASE_VERSION: ${{ inputs.version }}
          ATLAS_RELEASE_NOTES: ${{ inputs.release_notes }}
          ATLAS_RELEASE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          npm run test:release
          npm run release:validate
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --no-tags
          if git show-ref --verify --quiet "refs/remotes/origin/${ATLAS_RELEASE_REF}"; then
            SOURCE_SHA="$(git rev-parse "refs/remotes/origin/${ATLAS_RELEASE_REF}^{commit}")"
          else
            SOURCE_SHA="$(git rev-parse --verify --end-of-options "${ATLAS_RELEASE_REF}^{commit}")"
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Selected source must be contained in main."; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${ATLAS_RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release tag v${ATLAS_RELEASE_VERSION} already exists."; exit 1
          fi
          echo "version=${ATLAS_RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${ATLAS_RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    needs: validate-manual-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            bundles: nsis
            data_separator: ";"
          - os: macos-15-intel
            platform: mac
            arch: x64
            bundles: dmg
            data_separator: ":"
          - os: macos-15
            platform: mac
            arch: arm64
            bundles: dmg
            data_separator: ":"
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            bundles: appimage,deb
            data_separator: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-manual-release.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2

      - name: Build Next.js standalone server
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=http://127.0.0.1:43121/api/v1 npm run build
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi

      - name: Build FastAPI sidecar and stage complete Tauri runtime
        env:
          DATA_SEPARATOR: ${{ matrix.data_separator }}
        shell: bash
        run: |
          python -m pip install -r backend/requirements-desktop.txt
          python -m pip install pyinstaller
          pyinstaller --clean --onefile --name atlas-api --paths backend \
            --add-data "backend/migrations${DATA_SEPARATOR}migrations" \
            --add-data "backend/alembic.ini${DATA_SEPARATOR}." \
            --collect-all alembic --collect-all sqlalchemy --collect-all passlib --collect-all bcrypt \
            --hidden-import passlib.handlers.bcrypt backend/desktop_entry.py

          RUNTIME="desktop-tauri/resources/runtime"
          mkdir -p "$RUNTIME/frontend"
          if [ -f dist/atlas-api.exe ]; then
            cp dist/atlas-api.exe "$RUNTIME/atlas-api.exe"
          else
            cp dist/atlas-api "$RUNTIME/atlas-api"
            chmod 755 "$RUNTIME/atlas-api"
          fi
          cp -R frontend/.next/standalone/. "$RUNTIME/frontend/"
          cp -R frontend/.next/static "$RUNTIME/frontend/.next/static"
          if [ -d frontend/public ]; then cp -R frontend/public "$RUNTIME/frontend/public"; fi

          NODE_BIN="$(command -v node)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$NODE_BIN" "$RUNTIME/node.exe"
          else
            cp "$NODE_BIN" "$RUNTIME/node"
            chmod 755 "$RUNTIME/node"
          fi

          test -f "$RUNTIME/frontend/.next/BUILD_ID"
          test -f "$RUNTIME/frontend/server.js"
          test -f "$RUNTIME/atlas-api" -o -f "$RUNTIME/atlas-api.exe"
          test -f "$RUNTIME/node" -o -f "$RUNTIME/node.exe"

      - name: Set release version in Tauri manifests
        working-directory: desktop-tauri
        env:
          RELEASE_VERSION: ${{ needs.validate-manual-release.outputs.version }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["RELEASE_VERSION"]
          config_path = Path("tauri.conf.json")
          config = json.loads(config_path.read_text())
          config["version"] = version
          config_path.write_text(json.dumps(config, indent=2) + "\n")
          cargo_path = Path("Cargo.toml")
          cargo = cargo_path.read_text()
          import re
          cargo, count = re.subn(r'(?m)^(version = ")[^"]+(")$', rf'\g<1>{version}\g<2>', cargo, count=1)
          if count != 1:
              raise SystemExit("Could not update Cargo package version")
          cargo_path.write_text(cargo)
          PY

      - name: Generate platform icons
        working-directory: desktop-tauri
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('icons/icon.png'); p.write_bytes(base64.b64decode(p.read_text().strip(), validate=True))"
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Path("icons/icon.png")
          with Image.open(source) as image:
              image.convert("RGBA").resize((1024, 1024), Image.Resampling.LANCZOS).save("icons/source-1024.png")
          PY
          tauri icon icons/source-1024.png --output icons/generated

      - name: Build Tauri installer
        working-directory: desktop-tauri
        run: tauri build --ci --no-sign --bundles ${{ matrix.bundles }}

      - name: Verify installer outputs
        shell: bash
        run: |
          BUNDLE_DIR="desktop-tauri/target/release/bundle"
          mkdir -p release-output
          case "${{ matrix.platform }}" in
            win)
              for installer in "$BUNDLE_DIR"/nsis/*.exe; do [ -f "$installer" ] && cp "$installer" release-output/; done
              test -n "$(find release-output -maxdepth 1 -name '*.exe' -print -quit)"
              ;;
            mac)
                            for installer in "$BUNDLE_DIR"/dmg/*.dmg; do [ -f "$installer" ] && cp "$installer" release-output/; done
              test -n "$(find release-output -maxdepth 1 -name '*.dmg' -print -quit)"
              ;;
            linux)
                            for installer in "$BUNDLE_DIR"/appimage/*.AppImage "$BUNDLE_DIR"/appimage/*.appimage; do [ -f "$installer" ] && cp "$installer" release-output/; done
                            for installer in "$BUNDLE_DIR"/deb/*.deb; do [ -f "$installer" ] && cp "$installer" release-output/; done
              test -n "$(find release-output -maxdepth 1 -iname '*.appimage' -print -quit)"
              test -n "$(find release-output -maxdepth 1 -name '*.deb' -print -quit)"
              ;;
          esac
          {
            echo "Atlas version: ${{ needs.validate-manual-release.outputs.version }}"
            echo "Source commit: ${{ needs.validate-manual-release.outputs.source_sha }}"
            echo "Platform: ${{ matrix.platform }}"
            echo "Architecture: ${{ matrix.arch }}"
          } > release-output/build-info.txt

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-output/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate-manual-release, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: atlas-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        shell: bash
        run: |
          find . -type f ! -name "SHA256SUMS.txt" -print0 \
            | sort -z \
            | xargs -0 -r sha256sum > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-manual-release.outputs.tag }}
          target_commitish: ${{ needs.validate-manual-release.outputs.source_sha }}
          name: Atlas ${{ needs.validate-manual-release.outputs.tag }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          draft: false
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: ${{ inputs.prerelease && 'false' || 'true' }}
