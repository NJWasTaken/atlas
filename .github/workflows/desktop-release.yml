name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without the v prefix, e.g. 0.2.0)"
        required: true
        type: string
      source_ref:
        description: "Branch or commit to package (must be contained in main)"
        required: true
        default: "main"
        type: string
      release_notes:
        description: "Manually written release notes"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: atlas-desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  validate-manual-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manually supplied release metadata
        id: validate
        working-directory: desktop
        env:
          ATLAS_RELEASE_VERSION: ${{ inputs.version }}
          ATLAS_RELEASE_NOTES: ${{ inputs.release_notes }}
          ATLAS_RELEASE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          npm run test:release
          npm run release:validate

          git fetch origin main:refs/remotes/origin/main --no-tags
          SOURCE_SHA="$(git rev-parse --verify --end-of-options "${ATLAS_RELEASE_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "The selected source ref must point to a commit contained in main."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v${ATLAS_RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release tag v${ATLAS_RELEASE_VERSION} already exists."
            exit 1
          fi

          echo "version=${ATLAS_RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${ATLAS_RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Validated v${ATLAS_RELEASE_VERSION} from $SOURCE_SHA."

  build:
    needs: validate-manual-release
    if: >-
      always() &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      needs.validate-manual-release.result == 'success'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            target: nsis
            data_separator: ";"
          - os: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
            data_separator: ":"
          - os: macos-15
            platform: mac
            arch: arm64
            target: dmg
            data_separator: ":"
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            target: "AppImage deb"
            data_separator: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.validate-manual-release.outputs.source_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Next.js standalone server
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=http://127.0.0.1:43121/api/v1 npm run build
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi
      - name: Build FastAPI sidecar
        shell: bash
        run: |
          python -m pip install -r backend/requirements-desktop.txt
          pyinstaller --clean --onefile --name atlas-api --paths backend \
            --add-data "backend/migrations${{ matrix.data_separator }}migrations" \
            --add-data "backend/alembic.ini${{ matrix.data_separator }}." \
            --collect-all alembic --collect-all sqlalchemy --collect-all passlib --collect-all bcrypt --hidden-import passlib.handlers.bcrypt \
            backend/desktop_entry.py
          mkdir -p desktop/runtime
          if [ -f dist/atlas-api.exe ]; then cp dist/atlas-api.exe desktop/runtime/atlas-api.exe; else cp dist/atlas-api desktop/runtime/atlas-api; fi
          cp -R frontend/.next/standalone desktop/runtime/frontend
      - name: Package installer
        id: package
        working-directory: desktop
        shell: bash
        env:
          MANUAL_RELEASE_VERSION: ${{ needs.validate-manual-release.outputs.version }}
        run: |
          npm install --no-audit --no-fund
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_VERSION="$MANUAL_RELEASE_VERSION"
          else
            RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          fi
          npm version --no-git-tag-version --allow-same-version "$RELEASE_VERSION"
          npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --publish never
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Write build provenance
        working-directory: desktop
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_dispatch' && needs.validate-manual-release.outputs.source_sha || github.sha }}
        run: |
          printf 'Atlas version: %s\nSource commit: %s\nPlatform: %s\nArchitecture: %s\n' \
            "$RELEASE_VERSION" "$SOURCE_SHA" "${{ matrix.platform }}" "${{ matrix.arch }}" \
            > dist/build-info.txt
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: atlas-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
