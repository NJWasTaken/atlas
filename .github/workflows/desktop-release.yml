name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without the v prefix, e.g. 0.2.0)"
        required: true
        type: string
      release_notes:
        description: "Manually written release notes"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-manual-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate manually supplied release metadata
        id: validate
        working-directory: desktop
        env:
          ATLAS_RELEASE_VERSION: ${{ inputs.version }}
          ATLAS_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          npm run test:release
          npm run release:validate
          if git ls-remote --exit-code --tags origin "refs/tags/v${ATLAS_RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Release tag v${ATLAS_RELEASE_VERSION} already exists."
            exit 1
          fi
          echo "Release tag v${ATLAS_RELEASE_VERSION} is available."

  build:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            target: nsis
            data_separator: ";"
          - os: macos-14
            platform: mac
            target: dmg
            data_separator: ":"
          - os: ubuntu-24.04
            platform: linux
            target: "AppImage deb"
            data_separator: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Next.js standalone server
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=http://127.0.0.1:43121/api/v1 npm run build
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -R public .next/standalone/public; fi
      - name: Build FastAPI sidecar
        shell: bash
        run: |
          python -m pip install -r backend/requirements-desktop.txt
          pyinstaller --clean --onefile --name atlas-api --paths backend \
            --add-data "backend/migrations${{ matrix.data_separator }}migrations" \
            --add-data "backend/alembic.ini${{ matrix.data_separator }}." \
            --collect-all alembic --collect-all sqlalchemy --collect-all passlib --collect-all bcrypt --hidden-import passlib.handlers.bcrypt \
            backend/desktop_entry.py
          mkdir -p desktop/runtime
          if [ -f dist/atlas-api.exe ]; then cp dist/atlas-api.exe desktop/runtime/atlas-api.exe; else cp dist/atlas-api desktop/runtime/atlas-api; fi
          cp -R frontend/.next/standalone desktop/runtime/frontend
      - name: Package installer
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install --no-audit --no-fund
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --publish never
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-${{ matrix.platform }}
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 3

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download all platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: atlas-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
